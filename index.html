<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tài Xỉu V13 - Giftcode Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap');
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root { --gold-1: #ffe27a; --gold-2: #d4af37; --gold-3: #8a6d1f; --ink: #fff8ee; --muted: #d8b8b8; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: radial-gradient(800px 400px at 50% -10%, rgba(255,60,60,0.18), transparent 60%), radial-gradient(700px 500px at 50% 115%, rgba(120,10,10,0.5), transparent 60%), #160404; color: var(--ink); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; touch-action: none; }

        /* UI CHUNG */
        .top-bar { position: relative; width: 100%; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, #2a0a0a, #170404); border-bottom: 2px solid var(--gold-2); box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 20; }
        .top-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 900; letter-spacing: 8px; background: linear-gradient(180deg, #fff3b0, #d4af37); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
        @media (max-width: 600px) { .top-title { display: none; } }
        .logout-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 11px; cursor: pointer; }
        .balance-box { display: flex; align-items: center; gap: 10px; color: var(--gold-1); font-weight: 800; font-size: 18px; border: 1.5px solid var(--gold-2); padding: 6px 8px 6px 16px; border-radius: 999px; background: linear-gradient(180deg, rgba(255,215,0,0.18), rgba(0,0,0,0.5)); text-shadow: 0 0 12px rgba(255,200,0,0.5); box-shadow: 0 0 18px rgba(255,200,0,0.3); }
        /* Nút Nạp Giftcode */
        .add-money-btn { background: linear-gradient(180deg, #ffe27a, #d4af37); color: #3a2a00; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 18px; font-weight: 800; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 12px rgba(255,200,0,0.6); }

        .game-board { position: relative; margin-top: 50px; width: 98%; max-width: 650px; height: 420px; background: radial-gradient(ellipse at 50% 25%, #8f1d1d, #631111 50%, #3d0808); border-radius: 32px; border: 3px solid var(--gold-2); box-shadow: 0 0 0 4px #1a0505, 0 0 0 6px rgba(212,175,55,0.5), 0 30px 70px rgba(0,0,0,0.7), inset 0 0 60px rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .game-board::before { content: ""; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; border: 1px solid rgba(255,215,0,0.35); border-radius: 26px; pointer-events: none; }
        .timer-badge { position: absolute; top: -35px; background: radial-gradient(circle at 50% 30%, #3a0d0d, #1a0505); color: #ff3333; font-size: 44px; font-weight: 900; padding: 4px 32px; border-radius: 999px; border: 3px solid var(--gold-2); box-shadow: 0 0 30px rgba(255,200,0,0.5), 0 0 12px rgba(255,60,60,0.4); z-index: 100; text-shadow: 0 0 12px rgba(255,60,60,0.7); animation: timerGlow 1.6s ease-in-out infinite; }
        @keyframes timerGlow { 0%,100% { box-shadow: 0 0 30px rgba(255,200,0,0.5), 0 0 12px rgba(255,60,60,0.4); } 50% { box-shadow: 0 0 42px rgba(255,200,0,0.75), 0 0 20px rgba(255,60,60,0.6); } }

        .plate-area { position: relative; width: 240px; height: 240px; margin-top: 40px; display: flex; justify-content: center; align-items: center; }
        .plate-base { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at 50% 32%, #c9a227, #7a5c0e 55%, #2a1c00); border-radius: 50%; border: 3px solid #ffd700; box-shadow: 0 0 25px rgba(255,200,0,0.35), inset 0 2px 8px rgba(255,255,255,0.4); }
        .dice-group { position: absolute; display: flex; gap: 8px; z-index: 5; }
        .dice { width: 54px; height: 54px; background: linear-gradient(145deg, #ffffff, #e9e4d8); border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8px; box-shadow: inset 1px 1px 3px rgba(255,255,255,0.9), inset -2px -2px 5px rgba(0,0,0,0.15), 2px 3px 8px rgba(0,0,0,0.5); border: 1px solid #ddd; }
        .pip { width: 10px; height: 10px; background: #d32f2f; border-radius: 50%; place-self: center; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.35); }
        .bowl-lid { position: absolute; width: 260px; height: 260px; background: radial-gradient(circle at 32% 28%, #fff3b0, #e8b90f 38%, #8a5a00 68%, #3a2400); border-radius: 50%; border: 3px solid #ffd700; box-shadow: inset -14px -14px 35px rgba(0,0,0,0.6), inset 10px 10px 25px rgba(255,255,255,0.35), 0 20px 40px rgba(0,0,0,0.85); z-index: 50; cursor: move; display: flex; justify-content: center; align-items: center; transition: transform 0.1s; }
        .bowl-lid::before { content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 36px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fff3b0, #d4af37 60%, #7a5c0e); box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.7); }
        .bowl-lid::after { content: "RỒNG VÀNG"; color: rgba(90,58,0,0.6); font-weight: 900; font-size: 22px; letter-spacing: 4px; text-shadow: 0 1px 1px rgba(255,255,255,0.4); }
        .shaking { animation: shake 0.4s infinite; }
        @keyframes shake { 0% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(5px,5px) rotate(2deg); } 50% { transform: translate(0,-5px) rotate(0deg); } 75% { transform: translate(-5px,5px) rotate(-2deg); } 100% { transform: translate(0,0) rotate(0deg); } }

        .bet-options { display: flex; justify-content: space-between; width: 100%; padding: 0 18px; position: absolute; bottom: 26px; box-sizing: border-box; }
        .bet-box { width: 175px; height: 138px; background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.6)); border: 2px solid rgba(255,215,0,0.45); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12); }
        .bet-box:hover { transform: translateY(-2px); }
        .bet-box.tai { color: #ffcc00; background: linear-gradient(160deg, rgba(255,200,0,0.22), rgba(0,0,0,0.55)); }
        .bet-box.xiu { color: #fff; background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(0,0,0,0.55)); }
        .bet-box.active { border-color: #ffe27a; transform: scale(1.05); box-shadow: 0 0 35px rgba(255,215,0,0.65), inset 0 0 20px rgba(255,215,0,0.2); }
        .bet-box.tai .big-text { background: linear-gradient(180deg, #fff3b0, #f5b91d); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .bet-box.xiu .big-text { background: linear-gradient(180deg, #ffffff, #aeb9c9); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .big-text { font-size: 48px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .bet-amount { font-size: 13px; color: #ffe9b0; margin-top: 5px; background: rgba(0,0,0,0.6); padding: 3px 10px; border-radius: 999px; font-family: monospace; }
        .user-badge { background: rgba(0,0,0,0.6); color: #e8c9c9; font-size: 11px; padding: 3px 10px; border-radius: 999px; margin-bottom: 5px; border: 1px solid rgba(255,215,0,0.3); display: flex; align-items: center; gap: 3px; }

        .chip-bar { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 10; }
        .chip { width: 56px; height: 56px; border-radius: 50%; border: 3px dashed rgba(255,255,255,0.9); font-weight: 800; font-size: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 5px 12px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(0,0,0,0.12); text-shadow: 0 1px 0 rgba(255,255,255,0.35); transition: transform 0.12s, box-shadow 0.12s; }
        .chip:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 16px rgba(0,0,0,0.55), inset 0 0 0 3px rgba(0,0,0,0.12); }
        .chip:nth-child(1) { background: radial-gradient(circle at 30% 30%, #ffffff, #9ec5ff); color: #1a3a6b; }
        .chip:nth-child(2) { background: radial-gradient(circle at 30% 30%, #8dff9e, #1a8a3c); color: #053a18; }
        .chip:nth-child(3) { background: radial-gradient(circle at 30% 30%, #ff9a9a, #c62828); color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
        .chip:nth-child(4) { background: radial-gradient(circle at 30% 30%, #dca6ff, #6a1fa2); color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
        .chip:nth-child(5) { background: radial-gradient(circle at 30% 30%, #fff3b0, #f5b91d); color: #4a2c00; }
        .chip:active { transform: scale(0.9); }
        .btn-action { padding: 12px 26px; border-radius: 999px; border: none; font-weight: 700; cursor: pointer; color: white; margin: 2px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.12s, box-shadow 0.12s, filter 0.12s; }
        .btn-action:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .btn-action:active { transform: scale(0.97); }
        .btn-confirm { background: linear-gradient(180deg, #34d399, #047857); box-shadow: 0 6px 16px rgba(4,120,87,0.45); }
        .btn-cancel { background: linear-gradient(180deg, #f87171, #991b1b); box-shadow: 0 6px 16px rgba(153,27,27,0.45); }

        .volume-control { position: fixed; bottom: 10px; left: 10px; z-index: 200; display: flex; align-items: center; gap: 10px; background: rgba(20,5,5,0.7); padding: 8px 15px; border-radius: 999px; border: 1px solid rgba(255,215,0,0.35); }
        .rank-btn { position: fixed; top: 70px; left: 10px; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffe27a, #d4af37 55%, #8a6d1f); border: 2px solid rgba(255,255,255,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; color: #4a2c00; box-shadow: 0 0 18px rgba(255,200,0,0.55); cursor: pointer; z-index: 100; animation: pulse 2s infinite; }
        .rank-btn span { font-size: 10px; }
        .music-icon { font-size: 20px; cursor: pointer; }
        input[type=range] { width: 80px; accent-color: var(--gold-2); cursor: pointer; }

        .chat-container { position: fixed; right: 10px; top: 70px; bottom: 80px; width: 240px; background: rgba(20,5,5,0.72); border: 1px solid rgba(255,215,0,0.25); border-radius: 16px; display: flex; flex-direction: column; z-index: 5; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-header { background: linear-gradient(to right, rgba(255,215,0,0.15), rgba(0,0,0,0.4)); padding: 10px; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 1px; border-radius: 16px 16px 0 0; color: var(--gold-1); border-bottom: 1px solid rgba(255,215,0,0.2); }
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; text-shadow: 1px 1px 0 #000; pointer-events: auto; scrollbar-width: thin; }
        .chat-msg { margin-bottom: 8px; line-height: 1.4; animation: fadeIn 0.1s; word-wrap: break-word; }
        @media (max-width: 900px) { .chat-container { display: none; } }

        .donate-container { position: fixed; left: 10px; top: 140px; z-index: 50; display: flex; flex-direction: column; align-items: center; }
        .donate-btn { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff6b9d, #c2185b 60%, #880e4f); border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 0 18px rgba(255,64,129,0.6); color: #fff; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .donate-btn:disabled { filter: grayscale(1); cursor: not-allowed; }
        .donate-timer { font-size: 14px; background: #000; color: #ff6b9d; padding: 3px 8px; border-radius: 999px; margin-top: 5px; display: none; border: 1px solid #ff6b9d; font-weight: 700; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,2,2,0.78); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: linear-gradient(160deg, #2a0f0f, #120505); border: 1px solid rgba(255,215,0,0.4); border-radius: 22px; width: 95%; max-width: 450px; padding: 0; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 50px rgba(255,180,0,0.12); max-height: 80vh; }
        .modal-header { padding: 15px; background: rgba(0,0,0,0.35); border-bottom: 1px solid rgba(255,215,0,0.25); display: flex; justify-content: space-between; align-items: center; border-radius: 22px 22px 0 0; }
        .modal-body { padding: 12px; overflow-y: auto; color: #e8d8d8; font-size: 13px; }
        .login-input { width: 80%; padding: 13px; margin: 15px 0; border-radius: 14px; border: 1px solid rgba(255,215,0,0.45); background: rgba(0,0,0,0.55); color: var(--gold-1); font-size: 18px; align-self: center; text-align: center; font-weight: 700; text-transform: uppercase; }
        .login-input:focus { outline: none; border-color: var(--gold-1); box-shadow: 0 0 0 3px rgba(255,200,0,0.2); }

        .rank-table { width: 100%; border-collapse: collapse; }
        .rank-table th { background: rgba(255,255,255,0.06); color: var(--gold-1); padding: 10px; text-align: left; font-size: 12px; letter-spacing: 0.5px; }
        .rank-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 13px; }
        .rank-top1 { color: #ffe27a; text-shadow: 0 0 8px rgba(255,200,0,0.6); font-weight: 800; }
        .rank-top2 { color: #e5e7eb; font-weight: 700; }
        .rank-top3 { color: #e8a87c; font-weight: 700; }
        .rank-me { background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0,230,118,0.4); }

        .history-wrapper { width: 100%; margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .history-title { font-size: 12px; color: var(--muted); margin-bottom: 5px; width: 90%; display: flex; justify-content: space-between; letter-spacing: 0.5px; }
        .bead-road { width: 95%; height: 48px; background: rgba(0,0,0,0.55); border-radius: 999px; display: flex; align-items: center; padding: 0 12px; gap: 8px; overflow-x: auto; border: 1px solid rgba(255,215,0,0.2); }
        .bead { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: 800; color: #000; }
        .bead.tai { background: linear-gradient(180deg, #ffe27a, #f5b91d); border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 0 12px rgba(255,200,0,0.55); }
        .bead.xiu { background: linear-gradient(180deg, #ffffff, #c3ccd9); border: 2px solid rgba(0,0,0,0.25); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        #msg { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,5,0,0.92); backdrop-filter: blur(8px); border: 1px solid var(--gold-2); padding: 20px 40px; border-radius: 18px; color: var(--gold-1); font-weight: 800; font-size: 20px; display: none; z-index: 200; text-align: center; box-shadow: 0 0 35px rgba(255,180,0,0.45); text-transform: uppercase; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-height: 700px) { body { overflow-y: auto; } .game-board { margin-top: 20px; } }
    </style>
</head>
<body>
    <audio id="bgMusic" loop><source src="nhacnen.mp3" type="audio/mpeg"></audio>
    <audio id="sfxShake" src="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/alien_hit.wav"></audio> 
    <audio id="sfxBet" src="https://codeskulptor-demos.commondatastorage.googleapis.com/pang/pop.mp3"></audio>
    <audio id="sfxWin" src="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/bonus.wav"></audio>
    <audio id="sfxDonate" src="https://codeskulptor-demos.commondatastorage.googleapis.com/pang/arrow.mp3"></audio>

    <div class="volume-control">
        <span class="music-icon" id="muteIcon" onclick="toggleMute()">🔊</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
    </div>

    <div class="rank-btn" onclick="openRankModal()">
        🏆 <span>TOP</span>
    </div>

    <div class="donate-container" id="donateArea" style="display:none;">
        <button class="donate-btn" id="btnDonate" onclick="kheuDonate()" title="Khều Donate">💸</button>
        <div class="donate-timer" id="donateTimer">10s</div>
    </div>

    <div class="modal" id="loginModal" style="display:flex;">
        <div class="modal-content" style="padding: 20px;">
            <h2 style="color:var(--gold-1); margin:0 0 10px 0; text-align: center;">🔥 ONLINE SYNC V13 🔥</h2>
            <p style="color:#aaa; font-size:14px; text-align: center;">V13 - Giftcode Admin System</p>
            <input type="text" id="usernameInput" class="login-input" placeholder="Tên Đại Gia..." onkeypress="if(event.keyCode==13) login()">
            <button class="btn-action btn-confirm" style="padding:15px; width:80%; align-self:center; font-size: 16px;" onclick="login()">VÀO SÒNG</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="top-title">TÀI XỈU</div>
        <div><span style="color:#aaa; font-size:12px;">TK:</span> <strong id="playerName" style="color:#fff; font-size:14px;">...</strong> <button class="logout-btn" onclick="logout()">Thoát</button></div>
        <div class="balance-box">
            <span style="color:#ddd; font-size:14px">$</span> <span id="balanceDisplay">0</span>
            <button class="add-money-btn" onclick="openGiftcodeModal()">+</button>
        </div>
    </div>

    <div class="game-board">
        <div class="timer-badge" id="timerDisplay">--</div>
        <div class="plate-area">
            <div class="plate-base"></div>
            <div class="dice-group"><div class="dice" id="d1"></div><div class="dice" id="d2"></div><div class="dice" id="d3"></div></div>
            <div class="bowl-lid" id="bowl"></div>
        </div>
        <div id="statusText" style="margin-top: 15px; color: var(--gold-2); font-weight: bold; font-style: italic; font-size: 16px; text-shadow: 1px 1px 0 #000;">ĐANG ĐỒNG BỘ...</div>
        <div class="bet-options">
            <div class="bet-box tai" id="boxTai" onclick="chooseSide('TAI')">
                <div class="user-badge">👤 <span id="usersTai">0</span></div>
                <div class="big-text">TÀI</div>
                <div class="bet-amount" id="moneyTai">0</div>
            </div>
            <div class="bet-box xiu" id="boxXiu" onclick="chooseSide('XIU')">
                <div class="user-badge">👤 <span id="usersXiu">0</span></div>
                <div class="big-text">XỈU</div>
                <div class="bet-amount" id="moneyXiu">0</div>
            </div>
        </div>
    </div>

    <div class="chip-bar" id="controls">
        <div class="chip" onclick="addChip(10000)">10K</div>
        <div class="chip" onclick="addChip(50000)">50K</div>
        <div class="chip" onclick="addChip(100000)">100K</div>
        <div class="chip" onclick="addChip(500000)">500K</div>
        <div class="chip" onclick="allIn()">ALLIN</div>
        <button class="btn-action btn-cancel" onclick="cancelBet()">HỦY</button>
        <button class="btn-action btn-confirm" onclick="confirmBet()">ĐẶT</button>
    </div>

    <div class="history-wrapper">
        <div class="history-title"><span>SOI CẦU</span><span style="cursor:pointer; text-decoration:underline; color:var(--gold-1);" onclick="openHistoryModal()">LỊCH SỬ GD ></span></div>
        <div class="bead-road" id="beadRoad"></div>
    </div>

    <div class="chat-container">
        <div class="chat-header">KÊNH CHAT (LIVE)</div>
        <div class="chat-list" id="chatList"></div>
    </div>
    <div id="msg"></div>

    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header"><span style="font-weight:bold; color:var(--gold-1)">LỊCH SỬ DÒNG TIỀN</span><button class="btn-action btn-cancel" style="padding:5px 10px; margin:0;" onclick="closeHistoryModal()">×</button></div>
            <div class="modal-body" id="transList"></div>
        </div>
    </div>

    <div class="modal" id="rankModal">
        <div class="modal-content">
            <div class="modal-header"><span style="font-weight:bold; color:var(--gold-1)">🏆 BẢNG XẾP HẠNG</span><button class="btn-action btn-cancel" style="padding:5px 10px; margin:0;" onclick="closeRankModal()">×</button></div>
            <div class="modal-body"><table class="rank-table"><thead><tr><th>TOP</th><th>ĐẠI GIA</th><th style="text-align:right">TÀI SẢN (VNĐ)</th></tr></thead><tbody id="rankList"></tbody></table></div>
        </div>
    </div>

    <div class="modal" id="giftcodeModal">
        <div class="modal-content" style="padding: 20px;">
            <div class="modal-header" style="background:transparent; border:none; padding:0; justify-content:flex-end;">
                <button class="btn-action btn-cancel" style="padding:5px 10px; margin:0;" onclick="closeGiftcodeModal()">×</button>
            </div>
            <h2 style="color:var(--gold-1); text-align: center; margin-top:0;">NẠP GIFTCODE</h2>
            <p style="color:#aaa; font-size:13px; text-align: center;">Nhập mã code từ Admin để nhận tiền.</p>
            <input type="text" id="giftcodeInput" class="login-input" placeholder="Nhập mã tại đây..." onkeypress="if(event.keyCode==13) redeemCode()">
            <button class="btn-action btn-confirm" style="padding:12px; margin-top:10px; width:100%;" onclick="redeemCode()">XÁC NHẬN</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        let balance = 0, currentUser = null;
        let transactionHistory = [], beadHistory = [];
        let currentBet = 0, sideChosen = null;
        let isLocked = false, isResultReady = false, diceResults = [0,0,0];
        let usersTai = 0, usersXiu = 0;
        let mainLoop, hasPaid = false; 

        const PHASE_BET = 45;
        const PHASE_LOCK = 50;

        // NPC DATA
        let npcPlayers = [ { name: "Top1_Server", bal: 50000000000 }, { name: "Shark Hưng", bal: 23000000000 }, { name: "Đại Gia 79", bal: 12500000000 }, { name: "Trùm Đất Cảng", bal: 8900000000 }, { name: "Thiếu Gia HN", bal: 5600000000 }, { name: "Chị Đại Q4", bal: 3200000000 }, { name: "Vua Lì Đòn", bal: 1500000000 }, { name: "Thánh Bịp", bal: 800000000 }, { name: "Boy Phố Cổ", bal: 450000000 }, { name: "Dân Chơi 9x", bal: 100000000 } ];
        
        // CHAT DATA
        const npcNames = ["Bố Già", "Trùm Cuối", "Thánh Bịp", "Kẻ Hủy Diệt", "Nợ Mẹ 500k", "Bán Nhà", "Xa Bờ", "Về Bờ", "Đại Gia Rởm", "Admin", "Chim Mồi", "Thích Ăn Đòn", "Boy Nhà Nghèo", "Cậu Vàng"];
        const chatWaiting = ["Tài đi dm sợ gì", "Xỉu chết cụ bọn Tài", "Bịp vcl", "Admin chỉnh cầu à?", "All in Tài đi các con vợ", "Nhanh cái tay lên", "Ván này k về Xỉu tao đi bằng đầu", "Dm lại gãy", "Cầu như l**", "Lag vãi chưởng", "Bố mày tất tay", "Xin 50k gỡ với ae ơi", "Thua thông 10 tay rồi dm", "Cầu bệt đẹp thế còn gì", "Đừng nghe thằng trên nó lừa đấy", "Chết mẹ mày đi", "Gáy sớm ăn l**", "Uy tín cái đầu b`"];
        const chatWinTai = ["TÀI!! Húp trọn", "Biết ngay mà dm", "Chết cụ bọn Xỉu nha", "Tài rực rỡ ae ơi", "Gáy lênnn", "Ối dồi ôi tiền về", "Dm lại Tài à", "Bịp bợm vcl", "Xóa game đây", "Cầu ảo vãi lúa", "Admin hút máu", "Tao bảo rồi mà éo nghe", "Ngu thì chết"];
        const chatWinXiu = ["XỈU thơm phức", "Lụm lúa", "Về bờ rồi dm mừng quá", "Chết sặc tiết bọn Tài", "Xỉu uy tín vcl", "Dm cầu 1-1 à", "Bẻ cầu chết sặc máu", "Cay vãi lúa", "Thôi đi ngủ", "Còn cái nịt", "Trả tiền bố mày đây", "Bịp vãi chưởng"];
        const donateWinChat = ["Cầm lấy 5k mua mì tôm", "Bố thí cho mày", "Nghèo thì cút", "Lộc lá đấy", "Đừng cờ bạc nữa con"];
        const donateLoseChat = ["Biến mẹ mày đi", "Tiền đ' đâu mà cho", "Lo làm ăn đi", "Cút", "Xin cái đb"];

        // --- INIT ---
        function login() {
            const u = document.getElementById('usernameInput').value.trim();
            if(!u) return alert("Nhập tên vào dm!");
            currentUser = u;
            document.getElementById('playerName').innerText = currentUser;
            document.getElementById('loginModal').style.display = 'none';
            const stored = localStorage.getItem('taixiu_v13_' + currentUser);
            if(stored) {
                const d = JSON.parse(stored);
                balance = d.b; transactionHistory = d.t || []; beadHistory = d.bd || [];
            } else {
                balance = 5000; transactionHistory = []; beadHistory = [];
                logTransaction('Tân Thủ', 5000, true);
            }
            updateBalance(); renderTransHistory(); beadHistory.forEach(r => renderBead(r));
            checkDonateButton(); initFakeUsers(); startRealtimeLoop(); startFakeChat(); changeVolume(0.5);
        }
        function saveData() { if(currentUser) localStorage.setItem('taixiu_v13_' + currentUser, JSON.stringify({b:balance, t:transactionHistory, bd:beadHistory})); }
        function logout() { location.reload(); }

        // --- GIFTCODE SYSTEM ---
        const validCodes = {
            "TANTHU": 500000,
            "VEBO": 100000000,
            "ADMIN": 1000000000,
            "ALLIN": 5000000000,
            "PHUHOT": 20000000,
            "LUCKY": 88888888,
            "VIP": 500000000
        };

        function openGiftcodeModal() { document.getElementById('giftcodeModal').style.display = 'flex'; }
        function closeGiftcodeModal() { document.getElementById('giftcodeModal').style.display = 'none'; }
        
        function redeemCode() {
            const input = document.getElementById('giftcodeInput');
            const code = input.value.trim().toUpperCase();

            if(!validCodes[code]) {
                alert("Mã không đúng hoặc đã hết hạn!");
                return;
            }
            // Mỗi code chỉ đổi được 1 lần cho mỗi tài khoản (tránh spam ADMIN/ALLIN lấy tiền vô hạn)
            const usedKey = 'taixiu_v13_used_' + currentUser;
            const used = JSON.parse(localStorage.getItem(usedKey) || '[]');
            if(used.includes(code)) {
                alert("Mã này đã được sử dụng rồi!");
                return;
            }
            used.push(code);
            localStorage.setItem(usedKey, JSON.stringify(used));

            const amt = validCodes[code];
            balance += amt;
            logTransaction('Giftcode', amt, true);
            showMsg(`NẠP THÀNH CÔNG ${formatMoney(amt)}`, true);
            playSfx('sfxWin');
            updateBalance();
            saveData();
            closeGiftcodeModal();
            input.value = ""; // Xóa input
        }

        // --- SEEDED RANDOM ---
        function seededRandom(seed) { var x = Math.sin(seed++) * 10000; return x - Math.floor(x); }

        // --- REALTIME LOOP ---
        function startRealtimeLoop() {
            mainLoop = setInterval(() => {
                const now = new Date();
                const seconds = now.getSeconds(); 
                updateFakeUsers();

                if (seconds < PHASE_BET) {
                    let dTime = PHASE_BET - seconds;
                    document.getElementById('timerDisplay').innerText = dTime;
                    document.getElementById('timerDisplay').style.color = "#ff3333";
                    document.getElementById('statusText').innerText = "MỜI ĐẶT CƯỢC";
                    if (isLocked) {
                        isLocked = false; hasPaid = false; isResultReady = false;
                        document.getElementById('controls').style.opacity="1"; document.getElementById('controls').style.pointerEvents="auto";
                        resetBowl(); currentBet = 0; sideChosen = null; updateUI(); initFakeUsers();
                    }
                } else if (seconds < PHASE_LOCK) {
                    let dTime = PHASE_LOCK - seconds;
                    document.getElementById('timerDisplay').innerText = dTime;
                    document.getElementById('timerDisplay').style.color = "yellow";
                    document.getElementById('statusText').innerText = "ĐÃ KHÓA CƯỢC!";
                    if (!isLocked) {
                        isLocked = true;
                        document.getElementById('controls').style.opacity="0.5"; document.getElementById('controls').style.pointerEvents="none";
                    }
                } else {
                    document.getElementById('timerDisplay').innerText = "00";
                    if (!isResultReady) { rollDiceSynced(); } 
                    else { if(!hasPaid && seconds > 58) forceOpenBowl(); }
                }
            }, 1000);
        }

        // Render a dice face with pips (real dice look) instead of a plain number
        function diceHTML(v) {
            const layouts = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
            let cells = '';
            for (let i = 1; i <= 9; i++) cells += layouts[v].includes(i) ? '<div class="pip"></div>' : '<div></div>';
            return cells;
        }
        function rollDiceSynced() {
            playSfx('sfxShake'); const bowl = document.getElementById('bowl'); bowl.classList.add('shaking'); document.getElementById('statusText').innerText="ĐANG LẮC...";
            isResultReady = true;
            const now = new Date(); const seed = Math.floor(now.getTime() / 60000); 
            const r1 = seededRandom(seed); const r2 = seededRandom(seed + 1); const r3 = seededRandom(seed + 2);
            diceResults = [Math.floor(r1 * 6) + 1, Math.floor(r2 * 6) + 1, Math.floor(r3 * 6) + 1];
            setTimeout(() => {
                bowl.classList.remove('shaking');
                document.getElementById('d1').innerHTML=diceHTML(diceResults[0]); document.getElementById('d2').innerHTML=diceHTML(diceResults[1]); document.getElementById('d3').innerHTML=diceHTML(diceResults[2]);
                document.getElementById('statusText').innerText="MỞ BÁT! (NẶN ĐÊ)";
            }, 1500);
        }

        function checkWin() {
            if(hasPaid) return; hasPaid = true;
            const total = diceResults[0]+diceResults[1]+diceResults[2];
            const resultName = total > 10 ? 'TAI' : 'XIU';
            document.getElementById('statusText').innerText = `KẾT QUẢ: ${total} - ${resultName}`;
            beadHistory.push(resultName); if(beadHistory.length > 20) beadHistory.shift(); renderBead(resultName);
            burstChat(resultName); updateNPCBalances(); 
            if (currentBet > 0 && sideChosen) {
                if (sideChosen === resultName) {
                    playSfx('sfxWin'); const win = currentBet * 2; balance += win;
                    logTransaction(`Thắng ${resultName}`, win - currentBet, true); showMsg(`HÚP ${formatMoney(win)}`, true);
                } else {
                    logTransaction(`Thua ${sideChosen}`, currentBet, false); showMsg(`THUA RỒI DM`, false);
                }
            } else { showMsg(resultName, true); }
            updateBalance(); checkDonateButton(); saveData();
        }

        // --- COMMON FUNCS ---
        const bowl=document.getElementById('bowl'); let isD=false, sX, sY, iL, iT;
        function resetBowl(){ bowl.style.transition="transform 0.5s, opacity 0.5s"; bowl.style.transform="translate(0,0)"; bowl.style.opacity="1"; setTimeout(()=>bowl.style.transition="none",500); }
        bowl.addEventListener('mousedown', sD); bowl.addEventListener('touchstart', sD, {passive:false});
        function sD(e){ if(!isResultReady || hasPaid) return; isD=true; let c=e.touches?e.touches[0]:e; sX=c.clientX; sY=c.clientY; let st=window.getComputedStyle(bowl); let m=new DOMMatrix(st.transform); iL=m.m41; iT=m.m42; }
        document.addEventListener('mousemove', dD); document.addEventListener('touchmove', dD, {passive:false});
        function dD(e){ if(!isD)return; e.preventDefault(); let c=e.touches?e.touches[0]:e; bowl.style.transform=`translate(${iL+c.clientX-sX}px, ${iT+c.clientY-sY}px)`; }
        document.addEventListener('mouseup', eD); document.addEventListener('touchend', eD);
        function eD(){ if(!isD)return; isD=false; let st=window.getComputedStyle(bowl); let m=new DOMMatrix(st.transform); if(Math.sqrt(m.m41**2+m.m42**2)>80) forceOpenBowl(); }
        function forceOpenBowl() { if(hasPaid) return; const bowl=document.getElementById('bowl'); bowl.style.transition="opacity 0.3s"; bowl.style.opacity="0"; checkWin(); }
        
        function pushChatSystem(list, isVip) { const name = isVip ? "ĐẠI GIA" : npcNames[Math.floor(Math.random() * npcNames.length)]; const msg = list[Math.floor(Math.random() * list.length)]; const color = isVip ? "#ffd700" : `hsl(${Math.random() * 360}, 80%, 70%)`; const box = document.getElementById('chatList'); box.innerHTML += `<div class="chat-msg"><span style="color:${color};font-weight:bold">${name}:</span> <span style="color:#eee">${msg}</span></div>`; box.scrollTop = box.scrollHeight; }
        function startFakeChat() { const d = Math.floor(Math.random() * 600) + 200; setTimeout(()=>{ if(!hasPaid) pushChatSystem(chatWaiting, false); startFakeChat(); }, d); }
        function burstChat(r) { let c=0; const i=setInterval(()=>{ pushChatSystem(r==='TAI'?chatWinTai:chatWinXiu, false); c++; if(c>10) clearInterval(i); }, 100); }
        function updateNPCBalances() { npcPlayers.forEach(npc => { const isWin = Math.random() > 0.5; const changeAmt = Math.floor(npc.bal * (Math.random()*0.2)); if(isWin) npc.bal += changeAmt; else npc.bal -= changeAmt; if(npc.bal < 0) npc.bal = 0; }); }
        function renderLeaderboard() { let fullList = [...npcPlayers]; if(currentUser) fullList.push({ name: currentUser, bal: balance, isMe: true }); fullList.sort((a, b) => b.bal - a.bal); const tbody = document.getElementById('rankList'); let html = ''; fullList.forEach((p, index) => { let rankClass = ''; if(index === 0) rankClass = 'rank-top1'; else if(index === 1) rankClass = 'rank-top2'; else if(index === 2) rankClass = 'rank-top3'; let rowClass = p.isMe ? 'rank-me' : ''; html += `<tr class="${rowClass}"><td class="${rankClass}">#${index + 1}</td><td class="${rankClass}">${p.name} ${p.isMe ? '(Tôi)' : ''}</td><td style="text-align:right; color:#ddd">${formatMoney(p.bal)}</td></tr>`; }); tbody.innerHTML = html; }
        function openRankModal() { renderLeaderboard(); document.getElementById('rankModal').style.display = 'flex'; }
        function closeRankModal() { document.getElementById('rankModal').style.display = 'none'; }
        function changeVolume(val) { const bg = document.getElementById('bgMusic'); bg.volume = val; if(val==0){document.getElementById('muteIcon').innerText="🔇";bg.pause();}else{document.getElementById('muteIcon').innerText="🔊";bg.play().catch(()=>{});} }
        function toggleMute() { const s = document.getElementById('volSlider'); if(s.value>0){s.value=0;changeVolume(0);}else{s.value=0.5;changeVolume(0.5);} }
        function playSfx(id){ const a=document.getElementById(id); if(a){ const v=document.getElementById('volSlider').value; a.volume=Math.min(1,v*1.2); a.currentTime=0; a.play().catch(()=>{}); } }
        function initFakeUsers() { usersTai = Math.floor(Math.random()*1000)+500; usersXiu = Math.floor(Math.random()*1000)+500; updateUsersDisplay(); }
        function updateFakeUsers() { if(isLocked)return; usersTai+=Math.floor(Math.random()*20)-5; usersXiu+=Math.floor(Math.random()*20)-5; if(usersTai<0)usersTai=0; if(usersXiu<0)usersXiu=0; updateUsersDisplay(); }
        function updateUsersDisplay() { document.getElementById('usersTai').innerText=formatMoney(usersTai); document.getElementById('usersXiu').innerText=formatMoney(usersXiu); }
        function checkDonateButton() { const a=document.getElementById('donateArea'); if(balance<=50000){a.style.display='flex';document.getElementById('btnDonate').disabled=false;}else{a.style.display='none';} }
        function kheuDonate() { if(balance>50000)return alert("Giàu rồi xin cái gì!"); const b=document.getElementById('btnDonate'),t=document.getElementById('donateTimer'); b.disabled=true; t.style.display='block'; let c=10; t.innerText=c; const i=setInterval(()=>{c--;t.innerText=c;if(c<=0){clearInterval(i);t.style.display='none';resolveDonate();}},1000); }
        function resolveDonate() { if(Math.random()>0.4){playSfx('sfxDonate');const a=Math.floor(Math.random()*20000)+1000;balance+=a;logTransaction('Donate',a,true);pushChatSystem(donateWinChat,true);showMsg(`+${formatMoney(a)}`,true);}else{pushChatSystem(donateLoseChat,true);showMsg("Đéo cho!",false);} updateBalance();checkDonateButton(); }
        function logTransaction(t,a,w) { const n=new Date(),s=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; transactionHistory.unshift({t:s,type:t,amt:a,sign:w?'+':'-',cls:w?'win':'loss'}); if(transactionHistory.length>50)transactionHistory.pop(); saveData();renderTransHistory(); }
        function renderTransHistory() { const l=document.getElementById('transList'); let h=''; if(transactionHistory.length===0)h='<div style="text-align:center;color:#555">Trống</div>'; else transactionHistory.forEach(x=>{h+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #333;color:#ccc"><span style="font-size:11px;color:#777">${x.t}</span><span>${x.type}</span><span style="color:${x.cls=='win'?'#00e676':'#ff1744'}">${x.sign}${formatMoney(x.amt)}</span></div>`;}); l.innerHTML=h; }
        function renderBead(r) { const d=document.getElementById('beadRoad'), b=document.createElement('div'); b.className=`bead ${r==='TAI'?'tai':'xiu'}`; b.innerText=r==='TAI'?'T':'X'; d.appendChild(b); d.scrollLeft=d.scrollWidth; }
        function chooseSide(s) { if(isLocked)return; if(currentBet>0 && s!==sideChosen){showMsg("K ĐỔI CỬA!", false);return;} sideChosen=s; updateUI(); }
        function addChip(a) { if(isLocked)return; if(!sideChosen){showMsg("CHỌN CỬA!", false);return;} if(balance<a){showMsg("NẠP ĐÊ!", false);return;} playSfx('sfxBet'); balance-=a; currentBet+=a; updateBalance(); updateUI(); }
        function allIn() { if(isLocked)return; if(!sideChosen){showMsg("CHỌN CỬA!", false);return;} if(balance<=0)return; playSfx('sfxBet'); currentBet+=balance; balance=0; updateBalance(); updateUI(); }
        function cancelBet() { if(isLocked||currentBet===0)return; balance+=currentBet; currentBet=0; sideChosen=null; updateBalance(); updateUI(); }
        function confirmBet() { if(currentBet>0) showMsg("ĐÃ CƯỢC!", true); }
        function updateUI() { document.getElementById('boxTai').classList.remove('active'); document.getElementById('boxXiu').classList.remove('active'); if(sideChosen==='TAI'){document.getElementById('boxTai').classList.add('active');document.getElementById('moneyTai').innerText=formatMoney(currentBet);}else if(sideChosen==='XIU'){document.getElementById('boxXiu').classList.add('active');document.getElementById('moneyXiu').innerText=formatMoney(currentBet);}else{document.getElementById('moneyTai').innerText="0";document.getElementById('moneyXiu').innerText="0";} }
        function updateBalance() { document.getElementById('balanceDisplay').innerText=formatMoney(balance); }
        function formatMoney(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
        function showMsg(t,g) { const m=document.getElementById('msg'); m.innerText=t; m.style.color=g?'gold':'#fff'; m.style.borderColor=g?'gold':'red'; m.style.display='block'; setTimeout(()=>m.style.display='none',2000); }
        // Show dice faces on load so the board never looks empty
        ['d1','d2','d3'].forEach(id => document.getElementById(id).innerHTML = diceHTML(Math.floor(Math.random()*6)+1));
        function openHistoryModal() { document.getElementById('historyModal').style.display = 'flex'; }
        function closeHistoryModal() { document.getElementById('historyModal').style.display = 'none'; }
    </script>
</body>
</html>
